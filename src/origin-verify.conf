<IfModule mod_rewrite.c>
    RewriteEngine On
    # Capture the expected secret into %1.  If CLOUDFRONT_ORIGIN_SECRET is
    # empty or unset (e.g. local docker-compose), the condition is false and
    # all requests pass through unchanged.
    RewriteCond %{ENV:CLOUDFRONT_ORIGIN_SECRET} ^(.+)$
    # Reject any request whose X-Origin-Verify header does not match.
    RewriteCond %{HTTP:X-Origin-Verify} !^%1$
    RewriteRule ^ - [F,L]
</IfModule>
