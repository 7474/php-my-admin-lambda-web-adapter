<IfModule mod_rewrite.c>
    RewriteEngine On
    # If CLOUDFRONT_ORIGIN_SECRET is empty or unset (e.g. local
    # docker-compose), the condition is false and all requests pass through
    # unchanged.
    RewriteCond %{ENV:CLOUDFRONT_ORIGIN_SECRET} ^(.+)$
    # Reject any request whose X-Origin-Verify header does not exactly match
    # the configured secret.  expr with != performs a literal string comparison
    # so secrets containing regex metacharacters are handled safely.
    RewriteCond expr "req('X-Origin-Verify') != env('CLOUDFRONT_ORIGIN_SECRET')"
    RewriteRule ^ - [F,L]
</IfModule>
