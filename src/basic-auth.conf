<Directory "/var/www/html">
  AuthType Basic
  AuthName "phpMyAdmin"
  AuthUserFile /tmp/.htpasswd
  Require valid-user
</Directory>

# Ensure WWW-Authenticate is present on every 401 response.
# mod_auth_basic normally sets it, but Lambda Web Adapter / Lambda Function URL
# can strip headers during response conversion.  mod_headers re-adds it in the
# fixup phase so the browser always sees the challenge and shows the dialog.
<IfModule mod_headers.c>
  Header always set WWW-Authenticate "Basic realm=\"phpMyAdmin\"" "expr=%{REQUEST_STATUS} == '401'"
</IfModule>

