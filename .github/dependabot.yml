version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/src"
    schedule:
      interval: "weekly"
    ignore:
      # phpMyAdmin 5.2.x のサポート対象は PHP < 8.4 のため、PHP のマイナー/メジャー更新は手動で行う
      # https://www.phpmyadmin.net/downloads/
      - dependency-name: "php"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "terraform"
    directory: "/ecr-terraform"
    schedule:
      interval: "weekly"

  - package-ecosystem: "terraform"
    directory: "/example-terraform"
    schedule:
      interval: "weekly"
